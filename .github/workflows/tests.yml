---
name: Tests

on:
  push:
    branches: [public]
  pull_request:
    branches: [public]

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: requirements-docs.txt

      - name: Install the package without optional native extras
        run: |
          uv pip install --system -e . --no-deps

      - name: Install the pinned documentation dependencies
        run: |
          uv pip install --system -r requirements-docs.txt

      - name: Build the documentation
        run: |
          plctestbench-docs build site --strict

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: plctestbench-docs
          path: site/

  unit-tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest

    env:
      # The DSP modules import matplotlib; keep it headless on CI.
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: requirements-test.txt

      - name: Install the package without optional native extras
        run: |
          uv pip install --system -e . --no-deps

      - name: Install the pinned test dependencies
        run: |
          uv pip install --system -r requirements-test.txt

      - name: Run the unit test suite
        run: python -m pytest test -q
