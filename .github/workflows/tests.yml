---
name: Tests

on:
  push:
    branches: [public]
  pull_request:
    branches: [public]

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest

    env:
      # The DSP modules import matplotlib; keep it headless on CI.
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            pyproject.toml

      - name: Install the package without optional native extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps

      - name: Install the pinned test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run the unit test suite
        run: python -m pytest test -q
